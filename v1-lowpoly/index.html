<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Babi Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f28c28; --green: #2fa35a; --green-d: #23824a; --ink: #1f2a2e; --muted: #5d6b70;
    --card: rgba(255,255,255,.9); --line: rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0f5; font-family: Nunito, system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; touch-action: none; }
  .card { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.15); border: 1px solid rgba(255,255,255,.7); }
  button { font: inherit; cursor: pointer; border: 0; }
  [hidden] { display: none !important; }

  /* Start screen */
  #start { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: linear-gradient(180deg, rgba(143,208,245,.2), rgba(0,0,0,.25)); z-index: 20; }
  #start .card { width: min(420px, 100%); padding: 26px 24px 20px; text-align: center; }
  .logo { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 46px; line-height: 1; margin: 4px 0 2px;
    background: linear-gradient(90deg, #f28c28 20%, #2fa35a 80%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(0,0,0,.12); }
  .tag { color: var(--muted); font-weight: 700; margin-bottom: 18px; }
  .field { text-align: left; margin: 12px 0; }
  .field label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); font: inherit; font-weight: 700; background: #fff; outline: none; }
  .field input:focus { border-color: var(--green); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .sw.on { box-shadow: 0 0 0 3px var(--green); }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; padding: 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-weight: 800; }
  .seg button.on { background: var(--green); color: #fff; border-color: var(--green); }
  .big { width: 100%; padding: 15px; border-radius: 16px; background: linear-gradient(180deg, #4cc173, var(--green)); color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 var(--green-d); margin-top: 14px; }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-d); }
  .ghost { margin-top: 10px; padding: 10px 16px; border-radius: 12px; background: #fff; font-weight: 800; border: 1px solid var(--line); }
  .foot { margin-top: 14px; font-size: 11px; letter-spacing: .14em; font-weight: 800; color: var(--muted); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }
  #info { position: absolute; top: 14px; left: 14px; padding: 12px 16px; min-width: 210px; }
  #info .name { font-family: 'Baloo 2'; font-weight: 800; font-size: 20px; line-height: 1.1; }
  #info .row { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 14px; margin-top: 4px; }
  #money { color: var(--green-d); font-weight: 800; }
  #speed { display: flex; gap: 6px; margin-top: 8px; }
  #speed button { flex: 1; padding: 5px 0; border-radius: 9px; background: #fff; border: 1px solid var(--line); font-weight: 800; font-size: 12px; }
  #speed button.on { background: var(--ink); color: #fff; }
  #needs { position: absolute; top: 14px; right: 14px; padding: 12px 14px; width: 220px; }
  .need { display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
  .need .lbl { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; }
  .bar { height: 9px; background: rgba(0,0,0,.08); border-radius: 9px; overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; border-radius: 9px; transition: width .3s, background .3s; }
  #mood { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 800; font-size: 14px; text-align: center; }

  #menu { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); padding: 16px; max-height: 60vh; overflow: auto; }
  #menu h3 { margin: 0; font-family: 'Baloo 2'; font-size: 22px; line-height: 1.1; }
  #menu .sub { color: var(--muted); font-weight: 700; font-size: 14px; margin: 2px 0 12px; }
  #menu .actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .act { text-align: left; padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); font-weight: 800; font-size: 14px; }
  .act small { display: block; font-weight: 700; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .act:hover:not(:disabled) { border-color: var(--green); background: #f2fbf5; }
  .act:disabled { opacity: .5; cursor: not-allowed; }
  #menu .close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.06); font-weight: 800; }

  #progress { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(380px, calc(100% - 32px)); padding: 14px 16px; }
  #progress .t { font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #progress .bar { height: 12px; margin-top: 8px; }
  #progress .bar i { background: linear-gradient(90deg, #4cc173, var(--green)); transition: none; }
  #progress button { padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,.06); font-weight: 800; font-size: 13px; }

  #toasts { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -150px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 10px 16px; border-radius: 14px; background: rgba(31,42,46,.88); color: #fff; font-weight: 800; font-size: 14px; animation: tin .25s ease-out; text-align: center; max-width: 340px; }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }

  #help { position: absolute; left: 14px; bottom: 14px; padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--muted); max-width: 300px; }

  .float { position: absolute; transform: translate(-50%, -100%); pointer-events: none; font-weight: 800; white-space: nowrap; }
  .bubble { background: #fff; padding: 7px 11px; border-radius: 14px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.18); max-width: 220px; white-space: normal; text-align: center; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .gain { font-size: 18px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .nametag { font-size: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 8px; }

  @media (max-width: 640px) {
    #info { top: 8px; left: 8px; min-width: 0; padding: 10px 12px; }
    #needs { top: auto; bottom: 8px; right: 8px; left: 8px; width: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 10px; }
    .need { grid-template-columns: 1fr; text-align: center; gap: 0; margin: 0; font-size: 16px; }
    .need .lbl { display: none; }
    #mood { display: none; }
    #help { display: none; }
    #menu, #progress { bottom: 72px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="game"></div>

<div id="start">
  <div class="card">
    <div class="logo">Babi Life</div>
    <div class="tag">Vis ta vie à Abidjan 🇨🇮</div>
    <div id="newGame">
      <div class="field"><label>Prénom</label><input id="fName" maxlength="16" placeholder="Ama, Koffi, Aya…"></div>
      <div class="field"><label>Personnage</label><div class="seg" id="fGender"><button data-v="f" class="on">Femme</button><button data-v="m">Homme</button></div></div>
      <div class="field"><label>Peau</label><div class="swatches" id="fSkin"></div></div>
      <div class="field"><label>Pagne / tenue</label><div class="swatches" id="fTop"></div></div>
      <button class="big" id="btnStart">▶ Commencer ma vie</button>
    </div>
    <button class="ghost" id="btnContinue" hidden>Continuer ma partie</button>
    <div class="foot">UN JEU 100% BABI</div>
  </div>
</div>

<div id="hud" hidden>
  <div id="info" class="card">
    <div class="name" id="pname"></div>
    <div class="row"><span id="clock"></span><span id="money"></span></div>
    <div class="row" style="font-size:12px;color:var(--muted)"><span id="career"></span></div>
    <div id="speed"><button data-s="0">⏸</button><button data-s="1" class="on">▶</button><button data-s="4">▶▶</button><button data-s="12">▶▶▶</button></div>
  </div>
  <div id="needs" class="card"></div>
  <div id="menu" class="card" hidden><button class="close" id="menuClose">✕</button><h3 id="menuTitle"></h3><div class="sub" id="menuSub"></div><div class="actions" id="menuActions"></div></div>
  <div id="progress" class="card" hidden><div class="t"><span id="progLabel"></span><button id="progCancel">Annuler</button></div><div class="bar"><i id="progBar"></i></div></div>
  <div id="toasts"></div>
  <div id="help" class="card">🖱️ Clique pour marcher · clique un bâtiment ou une personne pour interagir · ZQSD/flèches · A/E ou glisser pour tourner · molette zoom</div>
  <div id="floats"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= Données ================= */
const SKINS = ['#5a3825', '#7a4a2e', '#8d5a3b', '#a8714a', '#c48d63', '#3d261a'];
const TOPS = ['#2a5bd7', '#e0453a', '#f2a71b', '#2fa35a', '#8e44ad', '#e86fa8', '#16a3a3'];
const NEEDS = [
  { k: 'faim', e: '🍛', n: 'Faim' },
  { k: 'energie', e: '⚡', n: 'Énergie' },
  { k: 'hygiene', e: '🚿', n: 'Hygiène' },
  { k: 'social', e: '💬', n: 'Social' },
  { k: 'fun', e: '🎉', n: 'Fun' },
];
const DECAY = { faim: 5, energie: 4, hygiene: 3, social: 3, fun: 4 }; // par heure de jeu
const SAVE_KEY = 'babi-life-save-v1';

const fmt = n => Math.round(n).toLocaleString('fr-FR') + ' FCFA';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = a => a[Math.floor(Math.random() * a.length)];
const hourOf = m => (m / 60) % 24;

let state = null; // sauvegarde
let startedAt = 0;

/* ================= Rendu ================= */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8fd0f5');
scene.fog = new THREE.Fog('#8fd0f5', 70, 170);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 400);

const hemi = new THREE.HemisphereLight('#d8eeff', '#5a7d3a', 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e0', 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -35, right: 35, top: 35, bottom: -35, near: 1, far: 120 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const mats = {};
const mat = (c, emissive) => {
  const key = c + (emissive ? '|e' : '');
  if (!mats[key]) mats[key] = new THREE.MeshLambertMaterial({ color: c, emissive: emissive ? c : '#000', emissiveIntensity: 0 });
  return mats[key];
};
const glowMats = [];
function glowMat(c) { const m = new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: 0 }); glowMats.push(m); return m; }

function box(w, h, d, c, x = 0, y = 0, z = 0, m) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || mat(c));
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

function signTexture(text, bg, fg = '#fff') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.beginPath(); g.roundRect(4, 4, 504, 120, 26); g.fill();
  g.fillStyle = fg; g.font = '800 54px Nunito, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 54;
  while (g.measureText(text).width > 470 && size > 20) { size -= 2; g.font = `800 ${size}px Nunito, sans-serif`; }
  g.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= Monde ================= */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), mat('#6fae4f'));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.name = 'ground';
scene.add(ground);

// terre rouge (latérite)
[[-22, -4, 14, 6], [-4, -4, 14, 6], [14, -4, 12, 6], [32, -4, 10, 6], [-12, 6, 10, 6]].forEach(([x, z, w, d]) => {
  const p = box(w, 0.04, d, '#c07a45', x, 0.02, z); p.castShadow = false; scene.add(p);
});
// routes
const road = box(300, 0.06, 6, '#4b4f54', 0, 0.03, 0); road.castShadow = false; scene.add(road);
for (let x = -148; x < 150; x += 6) { const l = box(2.6, 0.07, 0.18, '#f3f3f3', x, 0.04, 0); l.castShadow = false; scene.add(l); }
const road2 = box(6, 0.06, 60, '#4b4f54', 6, 0.03, -33); road2.castShadow = false; scene.add(road2);
// trottoirs
[-3.4, 3.4].forEach(z => { const s = box(300, 0.18, 0.8, '#bfb6a8', 0, 0.09, z); s.castShadow = false; scene.add(s); });

// plage + lagune Ébrié
const sand = box(300, 0.1, 10, '#ead3a0', 0, 0.05, 22); sand.castShadow = false; scene.add(sand);
const waterMat = new THREE.MeshLambertMaterial({ color: '#2f8fbf', transparent: true, opacity: 0.92 });
const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 140), waterMat);
water.rotation.x = -Math.PI / 2; water.position.set(0, 0.12, 97); scene.add(water);

// skyline du Plateau de l'autre côté de la lagune
[[-30, 8, 10], [-20, 6, 16], [-12, 7, 22], [-4, 9, 14], [6, 6, 26], [14, 8, 18], [24, 6, 12], [34, 7, 20]].forEach(([x, w, h], i) => {
  const b = box(w, h, 7, i % 2 ? '#9fb3c2' : '#c9d3db', x, h / 2, 88);
  b.castShadow = false; scene.add(b);
});
const pyr = new THREE.Mesh(new THREE.ConeGeometry(7, 20, 4), mat('#d9c9a8'));
pyr.position.set(44, 10, 90); pyr.rotation.y = Math.PI / 4; scene.add(pyr);

/* ---- végétation ---- */
function palm(x, z, s = 1) {
  const g = new THREE.Group();
  let px = 0;
  for (let i = 0; i < 6; i++) { const seg = box(0.32 - i * 0.02, 0.7, 0.32 - i * 0.02, i % 2 ? '#7a5634' : '#8b6440', px, 0.35 + i * 0.68, 0); g.add(seg); px += 0.06; }
  for (let i = 0; i < 7; i++) {
    const leafPivot = new THREE.Group();
    leafPivot.position.set(px, 4.2, 0);
    leafPivot.rotation.y = (i / 7) * Math.PI * 2;
    const leaf = box(2.2, 0.08, 0.6, i % 2 ? '#3f9a3f' : '#4fb04a', 1.1, 0, 0);
    leaf.rotation.z = -0.35;
    leafPivot.add(leaf); g.add(leafPivot);
  }
  g.add(box(0.35, 0.35, 0.35, '#6b4a2b', px + 0.15, 4.0, 0.1));
  g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = Math.random() * 6;
  scene.add(g);
}
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  g.add(box(0.4, 1.6, 0.4, '#6b4a2b', 0, 0.8, 0));
  g.add(box(2.2, 1.6, 2.2, '#3f8f3a', 0, 2.3, 0));
  g.add(box(1.5, 1, 1.5, '#4ea446', 0.2, 3.3, 0.1));
  g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = Math.random() * 6;
  scene.add(g);
}
[[-30, -4.5], [-14, -5], [2.5, 5], [22, 5], [40, -5], [-34, 6], [-2, 17], [18, 18], [30, 17], [-24, 18], [-40, 18], [44, 19], [-46, -8], [50, -10]].forEach(([x, z]) => palm(x, z, 0.9 + Math.random() * 0.4));
[[-34, -24], [-10, -26], [20, -26], [36, -24], [-26, 10], [10, 11], [28, 10], [-44, 4], [48, 4], [-6, -32], [16, -40]].forEach(([x, z]) => tree(x, z, 0.9 + Math.random() * 0.5));

/* ---- lampadaires ---- */
for (let x = -60; x <= 60; x += 15) {
  const g = new THREE.Group();
  g.add(box(0.15, 4, 0.15, '#555', 0, 2, 0));
  g.add(box(0.15, 0.15, 1, '#555', 0, 4, -0.45));
  g.add(box(0.4, 0.15, 0.4, '#ffe9a8', 0, 3.9, -0.9, glowMat('#ffe9a8')));
  g.position.set(x, 0, 3.8); scene.add(g);
}

/* ---- bâtiments ---- */
const obstacles = []; // AABB {x0,x1,z0,z1}
const clickables = [];
const buildings = {};

function garland(g, w, y, z) {
  const cols = ['#e0453a', '#f2c232', '#2fa35a', '#2a5bd7', '#e86fa8', '#16a3a3'];
  for (let i = 0; i <= w * 2; i++) {
    const x = -w / 2 + i * 0.5;
    const sag = Math.sin((i / (w * 2)) * Math.PI) * 0.25;
    g.add(box(0.14, 0.14, 0.14, '', x, y - sag, z, glowMat(cols[i % cols.length])));
  }
}

function makeBuilding(def) {
  const { x, z, w, d, h, wall, roof, facing = 1 } = def;
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  if (facing < 0) g.rotation.y = Math.PI;
  const front = d / 2;

  if (def.style === 'tower') {
    g.add(box(w, h, d, wall, 0, h / 2, 0));
    for (let fy = 1.6; fy < h - 0.5; fy += 1.4) g.add(box(w + 0.05, 0.5, d + 0.05, '#6fa8c9', 0, fy, 0));
    g.add(box(w + 0.3, 0.3, d + 0.3, roof, 0, h + 0.15, 0));
  } else {
    g.add(box(w, h, d, wall, 0, h / 2, 0));
    g.add(box(w + 0.6, 0.25, d + 0.6, roof, 0, h + 0.12, 0));
    g.add(box(w * 0.6, 0.6, d * 0.6, roof, 0, h + 0.5, 0));
    // fenêtres
    [-w / 3, w / 3].forEach(wx => g.add(box(1.2, 1, 0.08, '#9fc9de', wx, h * 0.55, front + 0.02)));
  }
  // porte
  g.add(box(1.2, 2.1, 0.1, '#5b3b24', 0, 1.05, front + 0.03));
  // enseigne
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w - 0.6, 5), Math.min(w - 0.6, 5) / 4), new THREE.MeshBasicMaterial({ map: signTexture(def.name, def.signColor || '#1f2a2e') }));
  sign.position.set(0, def.style === 'tower' ? 3.4 : h - 0.55, front + 0.07);
  if (def.style === 'tower') sign.position.y = 2.9;
  g.add(sign);

  if (def.style === 'maquis') {
    // terrasse couverte
    [-w / 2 + 0.3, w / 2 - 0.3].forEach(px => g.add(box(0.2, 2.6, 0.2, '#6b4a2b', px, 1.3, front + 3)));
    g.add(box(w + 0.4, 0.15, 3.4, '#c8553d', 0, 2.65, front + 1.6));
    garland(g, w, 2.45, front + 3.1);
    for (const tx of [-2.2, 0, 2.2]) {
      g.add(box(1.1, 0.08, 1.1, '#f2f2f2', tx, 0.8, front + 1.7));
      g.add(box(0.1, 0.8, 0.1, '#f2f2f2', tx, 0.4, front + 1.7));
      g.add(box(0.5, 0.5, 0.5, '#e0453a', tx - 0.8, 0.25, front + 1.7));
      g.add(box(0.5, 0.5, 0.5, '#2a5bd7', tx + 0.8, 0.25, front + 1.7));
      g.add(box(0.12, 0.3, 0.12, '#7a3b16', tx + 0.2, 0.98, front + 1.6));
    }
  }
  if (def.style === 'market') {
    const cols = ['#e0453a', '#f2a71b', '#2fa35a', '#2a5bd7'];
    [-w / 2 + 1.2, -w / 2 + 3, w / 2 - 3, w / 2 - 1.2].forEach((sx, i) => {

/* ================= Collisions & déplacement ================= */
function blocked(x, z) {
  if (z > 26.2 || Math.abs(x) > 80 || z < -70) return true;
  return obstacles.some(o => x > o.x0 && x < o.x1 && z > o.z0 && z < o.z1);
}
function segHits(ax, az, bx, bz, o) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dz = bz - az;
  for (const [p, d, lo, hi] of [[ax, dx, o.x0, o.x1], [az, dz, o.z0, o.z1]]) {
    if (Math.abs(d) < 1e-9) { if (p <= lo || p >= hi) return false; }
    else {
      let ta = (lo - p) / d, tb = (hi - p) / d;
      if (ta > tb) [ta, tb] = [tb, ta];
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
      if (t0 >= t1) return false;
    }
  }
  return true;
}
// prochain point de passage : contourne le premier obstacle sur la ligne droite
function nextWaypoint(pos, target) {
  const hit = obstacles.find(o => segHits(pos.x, pos.z, target.x, target.z, o));
  if (!hit) return target;
  const m = 0.6;
  const corners = [[hit.x0 - m, hit.z0 - m], [hit.x1 + m, hit.z0 - m], [hit.x0 - m, hit.z1 + m], [hit.x1 + m, hit.z1 + m]];
  let best = null, bestD = Infinity;
  for (const [cx, cz] of corners) {
    if (Math.hypot(cx - pos.x, cz - pos.z) < 0.3 || segHits(pos.x, pos.z, cx, cz, hit)) continue;
    // pénalité si ce coin ne voit pas la cible (il faudra un 2e coin) : évite les allers-retours
    const dd = Math.hypot(cx - pos.x, cz - pos.z) + Math.hypot(target.x - cx, target.z - cz) + (segHits(cx, cz, target.x, target.z, hit) ? 12 : 0);
    if (dd < bestD) { bestD = dd; best = new THREE.Vector3(cx, 0, cz); }
  }
  return best || target;
}
function stepTowards(person, target, speed, dt) {
  const pos = person.g.position;
  const wp = nextWaypoint(pos, target);
  const dx = wp.x - pos.x, dz = wp.z - pos.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.05) return Math.hypot(target.x - pos.x, target.z - pos.z);
  const step = Math.min(dist, speed * dt);
  const nx = pos.x + dx / dist * step, nz = pos.z + dz / dist * step;
  if (!blocked(nx, nz)) { pos.x = nx; pos.z = nz; }
  else if (!blocked(nx, pos.z)) pos.x = nx;
  else if (!blocked(pos.x, nz)) pos.z = nz;
  const targetRot = Math.atan2(dx, dz);
  let diff = targetRot - person.g.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  person.g.rotation.y += diff * Math.min(1, dt * 12);
  return Math.hypot(target.x - pos.x, target.z - pos.z);
}

function isOpen(a) {
  if (!a.open) return true;
  const h = hourOf(state.minutes);
  const [from, to] = a.open;
  return from < to ? h >= from && h < to : h >= from || h < to;
}
function actionBlock(a) {
  if (a.price && state.money < a.price) return 'Pas assez d\'argent';
  if (!isOpen(a)) return `Ouvert de ${a.open[0]}h à ${a.open[1]}h`;
  if (a.needShifts && state.shifts < a.needShifts) return `Il faut ${a.needShifts} journées au marché`;
  if (a.work && state.needs.energie < 20) return 'Trop fatigué·e pour bosser';
  if (a.req) return a.req();
  return null;
}
function durTxt(min) { return min >= 60 ? `${Math.round(min / 6) / 10}h`.replace('.', ',') : `${min} min`; }

function openMenu(title, sub, actions, target) {
  menuFor = target;
  $('menuTitle').textContent = title;
  $('menuSub').innerHTML = sub;
  const wrap = $('menuActions');
  wrap.innerHTML = '';
  for (const a of actions) {
    const b = document.createElement('button');
    b.className = 'act';
    const why = actionBlock(a);
    const bits = [durTxt(a.minutes)];
    if (a.price) bits.push(fmt(a.price));
    if (a.pay) bits.push('+' + fmt(a.pay));
    b.innerHTML = `${a.e} ${a.label}<small>${why || bits.join(' · ')}</small>`;
    b.disabled = !!why;
    b.onclick = () => startAction(a, target);
    wrap.appendChild(b);
  }
  $('menu').hidden = false;
}

  closeMenu();
  if (a.price) state.money -= a.price;
  if (target?.type === 'npc') { npcs[target.i].talking = true; }
  current = { a, target, done: 0 };
  $('progress').hidden = false;
  $('progLabel').textContent = `${a.e} ${a.label}…`;
  if (a.sleep || target?.type === 'building' && target.def.style !== 'maquis' && target.def.id !== 'plage') player.g.visible = false; // à l'intérieur
}
function finishAction(cancelled) {
  const { a, target, done } = current;
  const ratio = done / a.minutes;
  if (a.pay) {
    const pay = Math.round(a.pay * (cancelled ? ratio * 0.8 : 1) / 50) * 50;
    if (pay > 0) { state.money += pay; floatAt(player.g, '+' + fmt(pay), 'gain', 2); }
    if (!cancelled) {
      if (a.work === 'marche') { state.shifts++; if (state.shifts === 5) toast('🎉 Le Bureau Plateau t\'ouvre ses portes !'); }
      if (a.work === 'bureau') state.bureauShifts++;
    }
  }
  if (target?.type === 'npc') {
    const n = npcs[target.i];
    let relGain = (a.rel || 0) * (cancelled ? ratio : 1);
    if (a.joke && !cancelled) {
      if (Math.random() < 0.7) sayBubble(n, rand(['Hahaha, tu es mort de rire ! 😂', 'Djo, tu es trop fort ! 🤣', 'Aïe aïe, celle-là est bonne !']));
      else { sayBubble(n, 'Ta blague là est glacée deh 🥶'); relGain = -4; state.needs.fun = clamp(state.needs.fun - 10, 0, 100); }
    }
    if (a.loan) {
      state.loanDay = Math.floor(state.minutes / 1440);
      if (Math.random() < 0.5) { state.money += 5000; floatAt(player.g, '+' + fmt(5000), 'gain', 2); sayBubble(n, 'Tiens 5 000, mais faut pas oublier hein !'); relGain = -8; }
      else { sayBubble(n, 'Mon frère / ma sœur, moi-même je suis fauché·e 😅'); }
    }
    state.rels[target.i] = clamp((state.rels[target.i] || 0) + relGain, 0, 100);
    if (!a.joke && !a.loan) sayBubble(n, rand(LINES));
    n.talking = false;
  }
  if (!cancelled && a.sleep) toast('☀️ Bonne nuit ! Tu te réveilles reposé·e.');
  player.g.visible = true;
  current = null;
  $('progress').hidden = true;
  save();
}
$('progCancel').onclick = () => current && finishAction(true);

/* ================= Entrées ================= */
const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let camAngle = 0.6, camDist = 22, camAngleTarget = 0.6;
let goal = null; // {type:'move'|'building'|'npc', pos, def, i}
const keys = {};

function pick(ev) {
  ptr.x = (ev.clientX / innerWidth) * 2 - 1;
  ptr.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ptr, camera);
  const hits = raycaster.intersectObjects([...clickables, ground], true);
  for (const h of hits) {
    if (h.object.userData.npc !== undefined) return { type: 'npc', i: h.object.userData.npc };
    if (h.object.userData.building) return { type: 'building', def: h.object.userData.building };
    if (h.object === ground) return { type: 'move', pos: h.point };
  }
  return null;
}

let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { if (!state || performance.now() - startedAt < 400) return; downAt = { x: e.clientX, y: e.clientY, a: camAngleTarget }; });
renderer.domElement.addEventListener('pointermove', e => {
  if (downAt && e.buttons && Math.abs(e.clientX - downAt.x) > 8) camAngleTarget = downAt.a - (e.clientX - downAt.x) * 0.008;
  if (!e.buttons && state) { const p = pick(e); renderer.domElement.style.cursor = p && p.type !== 'move' ? 'pointer' : 'default'; }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || !state) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8;
  downAt = null;
  if (moved || current) return;
  const p = pick(e);
  if (!p) return;
  closeMenu();
  if (p.type === 'move') {
    goal = { type: 'move', pos: p.pos.clone().setY(0) };
    marker.position.set(p.pos.x, 0.1, p.pos.z); marker.material.opacity = 0.9;
  } else if (p.type === 'building') {
    goal = { type: 'building', def: p.def, pos: p.def.door.clone() };
  } else {
    goal = { type: 'npc', i: p.i };
    npcs[p.i].talking = true; npcs[p.i].target = null; // l'attend
  }
});
renderer.domElement.addEventListener('wheel', e => { camDist = clamp(camDist + e.deltaY * 0.02, 10, 42); }, { passive: true });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'a' || e.key === 'A') camAngleTarget += 0.4;
  if (e.key === 'e' || e.key === 'E') camAngleTarget -= 0.4;
  if (e.key === 'Escape') closeMenu();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let speedSetting = 1;
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  speedSetting = +b.dataset.s;
  document.querySelectorAll('#speed button').forEach(x => x.classList.toggle('on', x === b));
});

/* ================= Boucle ================= */
const clock = new THREE.Clock();
const skyDay = new THREE.Color('#8fd0f5'), skyNight = new THREE.Color('#0d1836'), skySet = new THREE.Color('#f59e62');
const tmpC = new THREE.Color();
let saveTimer = 0, lastHourWarn = {};

function updateSky() {
  const h = hourOf(state ? state.minutes : 15 * 60 + 40);
  const day = clamp(Math.sin((h - 6) / 12 * Math.PI) * 1.4, 0, 1);
  const dusk = Math.max(0, 1 - Math.abs(h - 18.3) / 1.3) + Math.max(0, 1 - Math.abs(h - 6.2) / 1.1);
  tmpC.copy(skyNight).lerp(skyDay, day).lerp(skySet, clamp(dusk, 0, 1) * 0.6);
  scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  hemi.intensity = 0.25 + day * 0.75;
  sun.intensity = day * 1.6;
  sun.color.set(dusk > 0.3 ? '#ffb27a' : '#fff4e0');
  const ang = (h - 6) / 12 * Math.PI;
  const c = player ? player.g.position : new THREE.Vector3();
  sun.position.set(c.x + Math.cos(ang) * 40, Math.max(8, Math.sin(ang) * 50), c.z + 20);
  sun.target.position.copy(c);
  const glow = 1 - day;
  for (const m of glowMats) m.emissiveIntensity = glow * 1.2;
  waterMat.color.set(day > 0.3 ? '#2f8fbf' : '#183c5e');
}

function tickNeeds(gameMin) {
  const n = state.needs;
  const sleeping = current?.a.sleep;
  for (const k in DECAY) {
    let d = DECAY[k] / 60 * gameMin;
    if (sleeping) d *= k === 'energie' ? 0 : 0.35;
    n[k] = clamp(n[k] - d, 0, 100);
  }
  if (current) {
    const a = current.a;
    const step = Math.min(gameMin, a.minutes - current.done);
    for (const k in a.fx) n[k] = clamp(n[k] + a.fx[k] * step / a.minutes, 0, 100);
    current.done += step;
    $('progBar').style.width = (current.done / a.minutes * 100) + '%';
    if (current.done >= a.minutes) finishAction(false);
  }
  // alertes
  for (const nd of NEEDS) {
    if (n[nd.k] < 15 && !lastHourWarn[nd.k]) { lastHourWarn[nd.k] = true; toast(`${nd.e} ${nd.n} très bas !`); }
    if (n[nd.k] > 25) lastHourWarn[nd.k] = false;
  }
  if (n.energie <= 0 || n.faim <= 0) faint(n.energie <= 0 ? 'de fatigue' : 'de faim');
}

function faint(why) {
  if (current) { current = null; $('progress').hidden = true; }
  toast(`😵 Tu t'es évanoui·e ${why}… Les voisins t'ont ramené·e. Clinique : -3 000 FCFA`);
  state.money = Math.max(0, state.money - 3000);
  state.minutes += 360;
  state.needs.energie = Math.max(state.needs.energie, 50);
  state.needs.faim = Math.max(state.needs.faim, 35);
  player.g.position.copy(buildings.maison.door);
  player.g.visible = true;
  goal = null;
  save();
}

function updatePlayer(dt) {
  let moving = false;
  if (current) { animatePerson(player, false, dt); return; }
  // clavier
  let kx = 0, kz = 0;
  if (keys['w'] || keys['z'] || keys['arrowup']) kz -= 1;
  if (keys['s'] || keys['arrowdown']) kz += 1;
  if (keys['q'] || keys['arrowleft']) kx -= 1;
  if (keys['d'] || keys['arrowright']) kx += 1;
  if (kx || kz) {
    goal = null; if (menuFor) closeMenu();
    const s = Math.sin(camAngle), c = Math.cos(camAngle);
    const dx = kx * c + kz * s, dz = -kx * s + kz * c;
    const len = Math.hypot(dx, dz);
    const t = player.g.position.clone().add(new THREE.Vector3(dx / len, 0, dz / len));
    stepTowards(player, t, 5.5, dt);
    moving = true;
  } else if (goal) {
    const tgt = goal.type === 'npc' ? npcs[goal.i].g.position : goal.pos;
    const stopDist = goal.type === 'npc' ? 1.5 : 0.15;
    const d = stepTowards(player, tgt, 5.5, dt);
    moving = true;
    if (d < stopDist) {
      moving = false;
      if (goal.type === 'building') {
        const dp = goal.def.door;
        player.g.rotation.y = Math.atan2(goal.def.x - dp.x, goal.def.z - dp.z);
        openBuildingMenu(goal.def);
      }
      if (goal.type === 'npc') openNpcMenu(goal.i);
      goal = null;
    }
  }
  animatePerson(player, moving, dt);
}

function updateNPCs(dt, gameMin) {
  for (const n of npcs) {
    let moving = false;
    if (!n.talking) {
      if (n.target) {
        const d = stepTowards(n, n.target, 2.4, dt);
        moving = true;
        if (d < 0.3) { n.target = null; n.wait = 2 + Math.random() * 6; }
      } else {
        n.wait -= dt;
        if (n.wait <= 0) {
          const [x, z] = rand(WANDER);
          n.target = new THREE.Vector3(x + Math.random() * 3 - 1.5, 0, z + Math.random() * 3 - 1.5);
        }
      }
    }
    animatePerson(n, moving, dt);
    if (!n.talking && Math.random() < dt * 0.02 && !n.bubble) sayBubble(n, rand(LINES));
  }
}

function updateFloats(dt) {
  const v = new THREE.Vector3();
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    if (f.life <= 0) {
      f.el.remove(); floats.splice(i, 1);
      npcs.forEach(n => { if (n.bubble === f) n.bubble = null; });
      continue;
    }
    const rise = f.el.classList.contains('gain') ? (1 - f.life / f.ttl) * 1.5 : 0;
    v.copy(f.obj.position); v.y += f.offset + rise;
    v.project(camera);
    f.el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px';
    f.el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px';
    f.el.style.opacity = v.z > 1 ? 0 : Math.min(1, f.life * 2);
  }
}

const camTarget = new THREE.Vector3(-10, 0, -2);
function updateCamera(dt, t) {
  camAngle += (camAngleTarget - camAngle) * Math.min(1, dt * 6);
  if (player) camTarget.lerp(player.g.position, Math.min(1, dt * 5));
  else { camAngleTarget += dt * 0.08; }
  const d = (player ? camDist : 26) * (camera.aspect < 0.8 ? 1.35 : 1);
  camera.position.set(camTarget.x + Math.sin(camAngle) * d * 0.72, d * 0.7, camTarget.z + Math.cos(camAngle) * d * 0.72);
  camera.lookAt(camTarget.x, 1, camTarget.z);
}

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (state) {
    let mult = speedSetting;
    if (current) mult = Math.max(speedSetting || 1, current.a.minutes / 3);
    const gameMin = dt * mult;
    state.minutes += gameMin;
    if (gameMin > 0) tickNeeds(gameMin);
    updatePlayer(speedSetting === 0 && !current ? 0 : dt);
    plumbob.position.set(player.g.position.x, 3.25 + Math.sin(t * 2.5) * 0.08, player.g.position.z);
    plumbob.rotation.y += dt * 1.5;
    plumbob.visible = player.g.visible;
    updateHUD();
    saveTimer += dt;
    if (saveTimer > 10) { saveTimer = 0; save(); }
  }
  updateNPCs(dt, 0);
  for (const c of cars) { c.g.position.x += c.speed * dt; if (c.g.position.x > 90) c.g.position.x = -90; if (c.g.position.x < -90) c.g.position.x = 90; }
  marker.material.opacity = Math.max(0, marker.material.opacity - dt * 0.8);
  marker.scale.setScalar(1 + (0.9 - marker.material.opacity) * 0.5);
  water.position.y = 0.12 + Math.sin(t) * 0.02;
  updateSky();
  updateCamera(dt, t);
  updateFloats(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ================= Sauvegarde & démarrage ================= */
function save() {
  if (!state || !player) return;
  state.pos = [player.g.position.x, player.g.position.z];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } }

function begin(s) {
  state = s;
  startedAt = performance.now();
  const look = s.look;
  player = makePerson({ gender: look.gender, skin: look.skin, top: look.top, accent: look.top, bottom: '#2b3a4a', hair: look.gender === 'f' ? look.top : '#1a1a1a' });
  player.g.position.set(s.pos[0], 0, s.pos[1]);
  $('pname').textContent = s.name;
  $('start').hidden = true;
  $('hud').hidden = false;
  camTarget.copy(player.g.position);
  camAngleTarget = camAngle = 0.5;
  toast(`Bienvenue à Babi, ${s.name} ! 🇨🇮`);
  setTimeout(() => toast('Va au marché pour gagner tes premiers FCFA 💰'), 1800);
}

// écran de création
const pick1 = (el, list, cb) => {
  el.innerHTML = list.map((c, i) => `<div class="sw${i === 0 ? ' on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('');
  el.onclick = e => { const s = e.target.closest('.sw'); if (!s) return; el.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === s)); cb(s.dataset.c); };
};
const look = { gender: 'f', skin: SKINS[0], top: TOPS[0] };
pick1($('fSkin'), SKINS, c => look.skin = c);
pick1($('fTop'), TOPS, c => look.top = c);
$('fGender').onclick = e => { const b = e.target.closest('button'); if (!b) return; look.gender = b.dataset.v; $('fGender').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };

$('btnStart').onclick = () => {
  const name = $('fName').value.trim() || (look.gender === 'f' ? 'Ama' : 'Koffi');
  begin({
    name, look: { ...look }, money: 5000, minutes: 8 * 60,
    needs: { faim: 70, energie: 85, hygiene: 75, social: 60, fun: 65 },
    pos: [-22, -6.5], shifts: 0, bureauShifts: 0, rels: {}, loanDay: -1,
  });
  save();
};
const existing = load();
if (existing) {
  $('btnContinue').hidden = false;
  $('btnContinue').textContent = `Continuer avec ${existing.name}`;
  $('btnContinue').onclick = () => begin(existing);
}

loop();
</script>
